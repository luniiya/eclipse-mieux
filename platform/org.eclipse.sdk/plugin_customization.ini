# plugin_customization.ini 
# sets default values for plug-in-specific preferences
# keys are qualified by plug-in id
# e.g., com.example.acmeplugin/myproperty=myvalue
# java.io.Properties file (ISO 8859-1 with "\" escapes)
# "%key" are externalized strings defined in plugin_customization.properties
# This file does not need to be translated.

# Property "org.eclipse.ui/defaultPerspectiveId" controls the 
# perspective that the workbench opens initially
org.eclipse.ui/defaultPerspectiveId=org.eclipse.jdt.ui.JavaPerspective

# put the perspective switcher on the top right
org.eclipse.ui/DOCK_PERSPECTIVE_BAR=topRight

# show progress on startup
org.eclipse.ui/SHOW_PROGRESS_ON_STARTUP=true

# show build id in the splash - only for nightly, integration, and maintenance builds
org.eclipse.ui.workbench/SHOW_BUILDID_ON_STARTUP=true

# use the window set by default
org.eclipse.ui/USE_WINDOW_WORKING_SET_BY_DEFAULT=true

# enable line number ruler in all textual editors by default
org.eclipse.ui.editors/lineNumberRuler=true

#enable UI freeze monitor
org.eclipse.ui.monitoring/monitoring_enabled=true

# Never show the workspace-selection dialog -- scripts/install.sh pins a
# fixed -data path in eclipse.ini, and a resurfaced dialog could let the
# user pick a different workspace, silently moving where .metadata/.log
# ends up (see CLAUDE.md's "Logs & crash diagnostics" section).
org.eclipse.ui.ide/SHOW_WORKSPACE_SELECTION_DIALOG=false

# Intro-related preferences (since 3.2)

# Welcome theme to use; for org.eclipse.sdk.ide we just use normal 'root' page
org.eclipse.ui.intro/INTRO_THEME = org.eclipse.ui.intro.universal.solstice

# Root page links to show in the Universal Welcome
org.eclipse.ui.intro.universal/INTRO_ROOT_PAGES = overview,tutorials,samples,whatsnew

# Initial page layout of the Universal Welcome
org.eclipse.ui.intro.universal/INTRO_DATA = product:introData.xml

# Order help books in table of contents
org.eclipse.help/HELP_DATA = helpData.xml

# Default text/code editor font -- the Mieux Lilac theme applies this
# monospace family to the whole UI. Qualifier is org.eclipse.ui.editors (EditorsPlugin's
# own preference store, confirmed via AbstractTextEditor/EditorsUI/
# TextEditorPreferencePage in the real source), not org.eclipse.ui.workbench
# -- JFaceResources.TEXT_FONT is read against whichever store the caller
# passes, and the text editor's default is EditorsUI.getPreferenceStore().
#
# The value is a JFace PreferenceConverter FontData *list* (semicolon-
# separated FontData entries), not a single font -- this is the documented
# mechanism for a fallback chain, not just one CJK/Latin pairing. Ordered
# by preference, JetBrainsMono Nerd Font Mono first, ending in the
# fontconfig generic "monospace" alias so there's always something
# monospaced even on a system with none of the named fonts installed.
org.eclipse.ui.editors/org.eclipse.jface.textfont=1|JetBrainsMono Nerd Font Mono|10|0|GTK|1|;1|FiraCode Nerd Font Mono|10|0|GTK|1|;1|CaskaydiaCove Nerd Font Mono|10|0|GTK|1|;1|JetBrainsMonoNL Nerd Font Mono|10|0|GTK|1|;1|MesloLGM Nerd Font Mono|10|0|GTK|1|;1|FantasqueSansM Nerd Font Mono|10|0|GTK|1|;1|DejaVu Sans Mono|10|0|GTK|1|;1|Liberation Mono|10|0|GTK|1|;1|Bitstream Vera Sans Mono|10|0|GTK|1|;1|Adwaita Mono|10|0|GTK|1|;1|monospace|10|0|GTK|1|
